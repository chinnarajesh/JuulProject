<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header slds-size_1-of-1">
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Warning</h2>
            </header>
            <!-- modal body start -->
            <div class="slds-modal__content slds-p-around_medium slds-size_1-of-1" id="modal-content-id-1">
                <h3 class="slds-text-heading_small slds-hyphenate">{message}</h3>
            </div>

            <!-- modal footer start-->
            <footer class="slds-modal__footer slds-size_1-of-1">
                <lightning-button variant="Neutral" class="slds-button" label="Cancel" onclick={handleCancel}>
                </lightning-button>
                <lightning-button variant="Brand" class="slds-button" label="Yes" onclick={handleYes}>
                </lightning-button>
            </footer>
        </div>
    </section>
</template>
