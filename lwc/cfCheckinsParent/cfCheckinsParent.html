</div>
            <template if:false={hasPermission}>

      </div><div data-style-id="state0element1" class="slds-col   slds-large-size_12-of-12 slds-medium-size_12-of-12 slds-small-size_12-of-12 slds-size_12-of-12  " data-rindex={rindex} style="

            </vlocity_ins-action>
            </div>
          </template>
