<template>
    <template if:true={showPopup}>
        <header class="slds-modal__header slds-size_1-of-1">
            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate"> Delete Action Plan Templates</h2>
        </header>
        <!-- modal body start -->
        <div class="slds-modal__content slds-p-around_medium slds-size_1-of-1" id="modal-content-id-1" style="text-align: center;">
            <h3 class="slds-text-heading_small slds-hyphenate">Are you sure you want to delete this Action Plan Template?</h3>
        </div>

        <!-- modal footer start-->
        <footer class="slds-modal__footer slds-size_1-of-1">
            <lightning-button variant="Neutral" class="slds-button" label="Cancel" onclick={handleCancel}>
            </lightning-button>
            <lightning-button variant="Brand" class="slds-button" label="Yes" onclick={handleYes}>
            </lightning-button>
        </footer>
    </template>
    <div class="lgc-bg container_height">
    <template if:true={loading}>
        <div class="loader">
            <lightning-spinner alternative-text="Loading" style="top: 35vh;bottom: 36vh;"></lightning-spinner>
        </div>
    </template>
    </div>
    <div class="lgc-bg container_height">
        <template if:true={loading2}>
            <div class="loader">
                <lightning-spinner alternative-text="Loading" style="top: 35vh;bottom: 36vh;"></lightning-spinner>
            </div>
        </template>
        </div>
</template>
