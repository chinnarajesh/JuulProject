<template>
    <header class="slds-modal__header slds-size_1-of-1">
        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Select Retail Store Groups</h2>
    </header>
    <div class="slds-modal__content slds-p-around_medium slds-size_1-of-1" id="modal-content-id-1">
        <div class="slds-scrollable" style="height:calc(100vh - 350px)">
            <div class="lgc-bg container_height">
                <template if:true={loading}>
                    <div class="loader">
                        <lightning-spinner alternative-text="Loading"></lightning-spinner>
                    </div>
                </template>

                <template if:false={loading}>
                    <lightning-input type="search" onchange={handleKeyChange} class="slds-m-bottom_small"
                        value={searchKey} placeholder="Search Retail Store Groups"></lightning-input>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-text-title_caps">
                                <th style="width:3.25rem;" class="slds-text-align_right">
                                    <div class="slds-form-element">

                                    </div>
                                    <div class="slds-resizable">
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Name">Name</div>
                                    <div class="slds-resizable">
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Description">Description</div>
                                    <div class="slds-resizable">
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Store Locations">Store Locations</div>
                                    <div class="slds-resizable">
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={currentPageData} for:item="rsg">
                                <tr key={rsg.Id} class={rsg.className}>
                                    <th scope="row" data-label="Name">
                                        <lightning-input type="checkbox" disabled={rsg.disabled} checked={rsg.selected}
                                            class="template" value={rsg.Id} onchange={handleCheckboxChange}>
                                        </lightning-input>
                                    </th>
                                    <td data-label="Name">
                                        <div class="slds-truncate" title="Name">{rsg.name}
                                        </div>
                                    </td>
                                    <td data-label="Description">
                                        <div class="slds-truncate" title="Description">{rsg.description}</div>
                                    </td>
                                    <td data-label="Store Location">
                                        <div class="slds-truncate" title="Store Location">{rsg.storeLocation}</div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>
        </div>
    </div>

    <footer class="slds-modal__footer slds-size_1-of-1 manage_footer">
        <template if:true={saveInProgress}>
            <div class="loader">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <template if:false={saveInProgress}>
            <lightning-button variant="Brand" class="slds-button" label="Associate Groups" onclick={createAssociation}
                disabled={blankRsGroups}>
            </lightning-button>

            <lightning-button variant="Neutral" class="slds-button" label="Cancel" onclick={closeModal}>
            </lightning-button>
        </template>
    </footer>
</template>
