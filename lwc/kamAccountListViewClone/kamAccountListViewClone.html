<template>
    <header class="slds-modal__header slds-size_1-of-1">
        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Create Action Plan Template with Items
        </h2>
    </header>
    <div class="slds-m-bottom_medium">
        <div class="slds-scrollable" style="height: 50vh">
            <div class="slds-p-around_medium lgc-bg container_height">
                <template if:true={tableLoadingState}>
                    <div class="loader">
                        <lightning-spinner alternative-text="Loading"></lightning-spinner>
                    </div>
                </template>

                <template if:false={tableLoadingState}>
                    <lightning-input type="search" onchange={handleKeyChange} class="slds-m-bottom_small"
                        value={searchKey} placeholder="Search Accounts"></lightning-input>
                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                        <thead>
                            <tr class="slds-text-title_caps">
                                <th style="width:3.25rem;" class="slds-text-align_right">
                                    <div class="slds-form-element">
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Name">Name</div>
                                    <div class="slds-resizable">
                                    </div>
                                </th>
                                <th scope="col">
                                    <div class="slds-truncate" title="Type">Type</div>
                                    <div class="slds-resizable">
                                    </div>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={currentPageData} for:item="account">
                                <tr key={account.Id} class={account.className}>
                                    <th scope="row" data-label="Name">
                                        <lightning-input type="checkbox" checked={account.selected} class="template"
                                            value={account.Id} onchange={handleAccountsSelect}>
                                        </lightning-input>
                                    </th>
                                    <td data-label="Name">
                                        <div class="slds-truncate" title="Name">{account.Name}
                                        </div>
                                    </td>
                                    <td data-label="Description">
                                        <div class="slds-truncate" title="Description">{account.Type}</div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>
            </div>
        </div>
        <!-- Child Component for Pagination Start -->
        <!-- <div style="text-align:center">
            <c-kam-pagination-navigator onprevious={onPrev} onnext={onNext} loading={tableLoadingState}
                disable-next-button={disableNextButton} disable-previous-button={disablePreviousButton}>
            </c-kam-pagination-navigator>
        </div> -->
        <!-- Child Component for Pagination End -->
    </div>

    <footer class="slds-modal__footer slds-size_1-of-1">

        <template if:true={saveInProgress}>
            <div class="loader">
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </div>
        </template>

        <template if:false={saveInProgress}>
            <lightning-button variant="Brand" class="slds-button" label="Clone" onclick={handleSave}>
            </lightning-button>
        </template>

        <lightning-button variant="Neutral" class="slds-button" label="Cancel" onclick={closeModal}>
        </lightning-button>
    </footer>

</template>
