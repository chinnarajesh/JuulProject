<template>
	<div class="slds-form-element comboBox_1">
		<template if:true={label}>
			<label class="slds-form-element__label">{label}</label>
			<template if:true={accHP}>
				<lightning-helptext alternative-text="" content="Can select multiple values.">
				</lightning-helptext>
			</template>
		</template>
		<div class="slds-form-element__control comboBOX">
			<div class="slds-combobox_container ">
				<div id="ms-picklist-dropdown"
					class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-picklist ms-picklist-dropdown"
					aria-expanded="false" aria-haspopup="listbox" role="combobox">
					<div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right allAccordien" role="none">
						<!-- <template if:false={retailBoolean}> -->
							<input class="slds-combobox__input ms-input " id="ms-input" data-label={label} aria-controls="ms-dropdown-items"
							role="textbox" type="button" value={_selectedItems} onfocus={onRefreshClick} readonly ></input>
						<!-- </template> -->
						<!-- <template if:true={retailBoolean}> -->
                            <!-- <input class="slds-combobox__input ms-input "  data-label={label} aria-controls="ms-dropdown-items"
                            role="textbox" type="text" value={_unselectItems} onfocus={onRefreshClick} readonly></input> -->
						<!-- </template> -->
						
						<span class="slds-icon_container slds-icon-utility-down slds-input__icon slds-input__icon_right"
							title="Click to open the dropdown">
							<lightning-icon icon-name="utility:down" size="x-small" alternative-text="Click here"
								class="slds-icon slds-icon--selected slds-icon--x-small slds-icon-text-default slds-m-right--x-large">
							</lightning-icon>
						</span>
					</div>

					<div id="ms-dropdown-items" class="te" role="listbox">
						<ul class="slds-listbox slds-listbox_vertical slds-dropdown slds-dropdown_fluid"
							role="presentation">
							<template if:true={showfilterinput}>
								<input class="slds-listbox__item ms-filter-input" id="ms-filter-input"
									aria-controls="ms-dropdown-items" role="textbox" type="text"
									placeholder="Search Options.." value={_filterValue} data-key={label} onfocus={onRefreshClick} onchange={filterDropDownValues}
									oninput={filterDropDownValues} ></input>
							</template>
							<!-- <template if:true={showclearbutton}>
								<lightning-button-icon icon-name="utility:clear" alternative-text="Clear Search Area"
									class="slds-m-left_xx-small" onclick={onClearClick}></lightning-button-icon>
							</template> -->
						
							<template if:true={options}> </template>
							<template if:true={showvaluesflag}>
								<template for:each={_mOptions} for:item="item">
									<c-pick-list-item key={item.key} item={item} fieldpai={fieldapiname}
										onitems={handleItemSelected} objecttabname={objecttabname}>
									</c-pick-list-item>
								</template>
							</template>
							<!-- <template if:false={showvaluesflag}>
								<li class="slds-listbox__item">Select an option</li>
							</template> -->
						</ul>
					</div>
				</div>

			</div>
		</div>
	</div>
</template>
