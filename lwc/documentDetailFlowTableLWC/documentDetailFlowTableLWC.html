<template>  
   <template if:true= {displayScreen1}>
      <h1><font size="5"><center>RMA Process</center></font></h1>
      <div class="slds-p-left_x-large slds-p-right_x-large slds-p-top_x-large ">
          <lightning-datatable 
          
                               key-field="Id" 
                               data={lstDocDetailFlowVar2} 
                               columns={columns} 
                               onsave={handleSave1}
                               draft-values={saveDraftValues} 
                               onrowselection={getSelectedIdAction}
                               >
                              
          </lightning-datatable>
                 
      </div>
      <div class="slds-p-top_x-large slds-p-left_x-large slds-p-right_x-large slds-size_1-of-3">
          <lightning-combobox
          name="Return Reason"
          value={valuePicklist}
          label= 'Reason for Return'
          placeholder="--None--"
          options={options}
          onchange={handleChangePicklist} 
          required="true">
        </lightning-combobox>
      </div>

      <div class="slds-p-top_x-large slds-p-left_x-large slds-p-right_x-large">
      <lightning-radio-group name="radioGroup"
          options={optionsRadio}
          label='Do you have items that need to be picked up?'
          value={valueRadio}
          type="radio"
          onchange={handleRadio}
          required="true">
      </lightning-radio-group>
      </div>
      <div class="slds-p-top_x-large slds-p-left_x-large slds-p-right_x-large">
      <lightning-button variant="Brand" class="slds-button" label="Next" onclick={handleNext}></lightning-button>
      </div><br>
  </template>

  <template  if:true= {displayScreenYes}>
    <center>
      <div class="slds-p-around_medium lgc-bg slds-size_1-of-3">
      <lightning-input type="text" value={pickUpHrs} label="Please provide pick-up hours"  required="true" onchange={inputValueChange}></lightning-input>
    </div>
    </center>
   <center><div class="slds-p-around_medium lgc-bg slds-size_1-of-3">
    <lightning-input type="text" value={totalBox} label="Total Boxes for Return" required="true" onchange={inputValueChange}></lightning-input>
    </div>
  </center>
    <center>
    <div class="slds-p-around_medium lgc-bg slds-size_1-of-3">
      <lightning-input type="text" value={totalweight} label="Total Weight for boxes" required="true" onchange={inputValueChange}></lightning-input>
    </div>
    </center>
    <center>
      <div class="slds-p-around_medium lgc-bg slds-size_1-of-3">
      <lightning-input type="text" value={totalpallet} label="Total Pallets" required="true" onchange={inputValueChange}></lightning-input>
    </div>
    </center>

    <div class="slds-p-top_x-large slds-p-left_x-large slds-p-right_x-large">
      <lightning-button variant="Brand" class="slds-button" label="Save" onclick={handleCaseCreation}></lightning-button>
      <lightning-button variant="Brand" class="slds-button" label="Back" onclick={navigateToBack}></lightning-button>
     <!-- <lightning-button variant="Brand" class="slds-button" label="Close" slot="actions" onclick={closeModal}></lightning-button>-->
    </div><br>
  </template>

  <template if:true= {displayScreenNo}>

  <div class="slds-p-top_x-large slds-p-left_x-large slds-p-right_x-large">
