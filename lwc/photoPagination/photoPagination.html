<template>
    <div class="slds-m-aroung_small slds-align_absolute-center">
        <lightning-spinner if:true={isLoading} alternative-text="Loading" size="small"></lightning-spinner>
        <div slot="actions" style="display:flex;">
            <lightning-button variant="neutral" title="first" label="First" class="slds-float_left slds-m-right_x-small"
                icon-name="utility:chevronleft" icon-position="left" onclick={handleClick}></lightning-button>
            <lightning-button variant="neutral" title="previous" class="slds-float_left slds-m-right_x-small" label="Previous"
                icon-name="utility:chevronleft" icon-position="left" onclick={handleClick}></lightning-button>
                <lightning-combobox
               style="position:relative; bottom:18.7px;"
            name="pagenum"
            value={selectedpagenumber}
            placeholder="Select Page Number"
            options={pagelinks}
            onchange={handlePage} ></lightning-combobox>
            <lightning-button variant="neutral" title="next" class="slds-float_right slds-m-left_x-small" label="Next"
            icon-name="utility:chevronright" icon-position="right" onclick={handleClick}></lightning-button>
       
            <lightning-button variant="neutral" title="last" class="slds-float_right slds-m-left_x-small" label="Last"
            icon-name="utility:chevronright" icon-position="right" onclick={handleClick}></lightning-button>
           
        </div>
    </div>
    <div class="slds-m-top_small"></div>
    <h2 class="slds-m-aroung_small slds-align_absolute-center" style="color: rgb(20, 20, 20);">
        Displaying Page No:
        &nbsp;{pageNo}/{totalPages}
    </h2>

</template>
