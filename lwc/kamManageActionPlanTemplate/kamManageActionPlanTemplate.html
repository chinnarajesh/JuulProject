    <footer class="slds-modal__footer slds-size_1-of-1 manage_footer">
        <div class="slds-grid slds-gutters">
            <template if:true={saveInProgress}>
                <div class="loader">
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div>
            </template>

            <div class="slds-col">
                <template if:false={cascadeToDoorDisable}>
                    <template if:false={saveInProgress}>
                        <lightning-button variant="Brand" class="slds-button" label="Cascade Mission to Doors"
                            disabled={cascadeFlag} onclick={cascadeToDoor}>
                        </lightning-button>
                    </template>
                </template>
            </div>
            <!--Added by Shreya for ticket SFDC - 0000004197 -->
            <div class="slds-col">
                <template if:true={PlanButton}>
                    <template if:false={saveInProgress}>
                        <lightning-button variant="Brand" class="slds-button" label="Committed to Forecast"
                            disabled={ISLFlag} onclick={handleCascadeToDoorClick}>
                        </lightning-button>
                    </template>
                </template>
            </div>
            <div class="slds-col">
                <template if:true={OverrideField}>
                    <template if:false={PlanButton}>
                        <lightning-button variant="Brand" class="slds-button" label="Override Products"
                            onclick={handleOverrideProduct}>
                        </lightning-button>
                    </template>
                </template>
            </div>
            <!--end for ticket SFDC - 0000004197-->
            <!--Added by Shreya for ticket SFDC - 0000004466 -->
            <div class="slds-col">
                <template if:false={OverrideField}>

                    <template if:true={Executionstatus}>
                        <template if:false={saveInProgress}>
                            <template if:true={CascadeChanges}>
                                <template if:false={APTChanges}>
                                    <lightning-button variant="Brand" class="slds-align_absolute-center"
                                        label="Cascade Changes" onclick={handleCascadeChangesClick}>
                                    </lightning-button>
                                </template>
                            </template>
                        </template>
                    </template>
                </template>
            </div>
            <!--end for ticket SFDC - 0000004466 -->
            <div class="slds-col">
                <template if:false={saveInProgress}>
                    <lightning-button variant="Neutral" class="slds-button" label="Cancel" onclick={closeModal}>
                    </lightning-button>

                    <lightning-button variant="Brand" class="slds-button" label="Save" onclick={handleSave}
                        disabled={disableSave}>
                    </lightning-button>
                </template>
            </div>
        </div>
    </footer>

    <template if:true={showPopup}>

        <div class="slds-backdrop slds-backdrop_open backdrop_container"></div>
