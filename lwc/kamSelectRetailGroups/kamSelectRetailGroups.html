<template>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <header class="slds-modal__header slds-size_1-of-1">
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Select Retail Store Groups
                </h2>
            </header>
            <div class="slds-modal__content slds-p-around_medium slds-size_1-of-1" id="modal-content-id-1">
                <div class="slds-scrollable" style="height:calc(100vh - 350px)">
                    <div class="lgc-bg container_height">
                        <template if:true={loading}>
                            <div class="loader">
                                <lightning-spinner alternative-text="Loading"></lightning-spinner>
                            </div>
                        </template>

                        <template if:false={loading}>
                            <table
                                class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered">
                                <thead>
                                    <tr class="slds-text-title_caps">
                                      
                                        <th style="width:3.25rem;" class="slds-text-align_right">
                                            <div class="slds-form-element">
                                                <lightning-input type="checkbox"
                                                class="Items"  id={updatedRsg.Id}
                                                onchange={handleSelectDeselectAll} 
                                                >
                                            </lightning-input>
                                            </div>
                                            <div class="slds-resizable">
                                            </div>
                                        </th>
                                        <th scope="col">
                                            <div class="slds-truncate" title="Name">Name</div>
                                            <div class="slds-resizable">
                                            </div>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={updatedRsg} for:item="rsg">
                                        <tr key={rsg.Id} class={rsg.className}>
                                            <th scope="row" data-label="Name">
                                                <lightning-input type="checkbox" class="template" value={rsg.Id}
                                                checked={rsg.selected} onchange={handleCheckboxChange}>
                                                </lightning-input>
                                            </th>
                                            <td data-label="Name">
                                                <div class="slds-truncate" title="Name">{rsg.name}
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                    </div>
                </div>
            </div>

            <footer class="slds-modal__footer slds-size_1-of-1 manage_footer">
                <template if:true={applyInProgress}>
                    <div class="loader">
                        <lightning-spinner alternative-text="Loading"></lightning-spinner>
                    </div>
                </template>

                <template if:false={applyInProgress}>
                    <lightning-button variant="Brand" disabled={disableApplyButton} class="slds-button" label="Apply"
                        onclick={applyItemsToRsg}>
                    </lightning-button>

                    <lightning-button variant="Neutral" class="slds-button" label="Cancel" onclick={closeModal}>
                    </lightning-button>
                </template>
            </footer>
        </div>
    </section>
</template>
